<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unfiltered Volatility Dashboard</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gainer: #4ade80;
            --loser: #f87171;
            --accent: #facc15;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 24px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .control-panel { background-color: var(--bg-card); border: 1px solid var(--border); padding: 24px; border-radius: 16px; margin-bottom: 32px; display: flex; flex-direction: column; gap: 16px; }
        .slider-header { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; color: var(--text-main); }
        .slider-val { color: var(--accent); font-size: 20px; font-weight: 800; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; background: #475569; outline: none; appearance: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }
        .slider-ticks { display: flex; justify-content: space-between; text-xs: 12px; color: var(--text-muted); font-size: 11px; margin-top: 4px; }
        .metrics-pill { background: #020617; padding: 12px 24px; border-radius: 8px; border: 1px solid var(--border); text-align: center; align-self: flex-start; min-w: 140px; }
        .metrics-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .metrics-val { font-size: 24px; font-weight: 900; color: #fff; }
        .columns { display: grid; grid-template-columns: 1fr; gap: 32px; }
        @media (min-width: 768px) { .columns { grid-template-columns: 1fr 1fr; } .control-panel { flex-direction: row; align-items: center; } .slider-box { flex: 1; } }
        .column-title { font-size: 20px; font-weight: 800; margin-bottom: 16px; }
        .gainers-title { color: var(--gainer); }
        .losers-title { color: var(--loser); }
        .list { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .ticker-sym { font-size: 18px; font-weight: 900; color: #fff; }
        .ticker-name { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-w: 180px; }
        .card-right { text-align: right; }
        .price { font-family: monospace; font-size: 13px; color: var(--text-muted); font-weight: bold; }
        .change-pct { font-size: 16px; font-weight: 900; }
        .pct-gainer { color: var(--gainer); }
        .pct-loser { color: var(--loser); }
        .empty-msg { font-size: 14px; color: var(--text-muted); font-style: italic; text-align: center; padding: 24px; border: 1px dashed var(--border); border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Unfiltered Volatility Board</h1>
            <p class="subtitle">Showing 100% of all small and micro-cap movers. Tweak the slider to dynamically isolate targets.</p>
        </header>

        <section class="control-panel">
            <div class="slider-box" style="width: 100%;">
                <div class="slider-header">
                    <span>Minimum Movement Threshold</span>
                    <span id="sliderValue" class="slider-val">10.0%</span>
                </div>
                <!-- Extended max threshold parameter to 500% to support massive breakouts -->
                <input type="range" id="percentSlider" min="0.5" max="500" step="0.5" value="10">
                <div class="slider-ticks">
                    <span>0.5% (All Moves)</span>
                    <span>100% (Parabolic)</span>
                    <span>250% (Massive Run)</span>
                    <span>500% (Max Spikes)</span>
                </div>
            </div>
            <div class="metrics-pill">
                <div class="metrics-label">Matches</div>
                <div id="matchCount" class="metrics-val">0</div>
            </div>
        </section>

        <main class="columns">
            <div>
                <h2 class="column-title gainers-title">▲ Top Gainers</h2>
                <div id="gainersList" class="list"></div>
            </div>
            <div>
                <h2 class="column-title losers-title">▼ Top Losers</h2>
                <div id="losersList" class="list"></div>
            </div>
        </main>
    </div>

    <!-- Reads structural data straight from data.js -->
    <script src="data.js"></script>
    <script>
        const slider = document.getElementById('percentSlider');
        const sliderValue = document.getElementById('sliderValue');
        const gainersList = document.getElementById('gainersList');
        const losersList = document.getElementById('losersList');
        const matchCount = document.getElementById('matchCount');

        function updateScannerDisplay(threshold) {
            gainersList.innerHTML = '';
            losersList.innerHTML = '';
            let totalMatches = 0;

            if (typeof fullMarketData === 'undefined') {
                const errMsg = '<div class="empty-msg">Waiting for data.js file to load...</div>';
                gainersList.innerHTML = errMsg; losersList.innerHTML = errMsg;
                return;
            }

            fullMarketData.forEach(stock => {
                if (Math.abs(stock.change) >= threshold) {
                    totalMatches++;
                    const isGainer = stock.type === 'gainer';
                    const card = document.createElement('div');
                    card.className = "card";
                    
                    card.innerHTML = `
                        <div>
                            <div class="ticker-sym">${stock.ticker}</div>
                            <div class="ticker-name">${stock.name}</div>
                        </div>
                        <div class="card-right">
                            <div class="price">$${stock.price.toFixed(3)}</div>
                            <div class="change-pct ${isGainer ? 'pct-gainer' : 'pct-loser'}">
                                ${isGainer ? '+' : ''}${stock.change.toFixed(2)}%
                            </div>
                        </div>
                    `;
                    
                    if (isGainer) gainersList.appendChild(card);
                    else losersList.appendChild(card);
                }
            });

            matchCount.textContent = totalMatches;
            
            if(gainersList.children.length === 0) gainersList.innerHTML = '<div class="empty-msg">No matching gainers found at this threshold</div>';
            if(losersList.children.length === 0) losersList.innerHTML = '<div class="empty-msg">No matching losers found at this threshold</div>';
        }

        slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value).toFixed(1);
            sliderValue.textContent = val + '%';
            updateScannerDisplay(parseFloat(val));
        });

        updateScannerDisplay(parseFloat(slider.value));
    </script>
</body>
</html>
